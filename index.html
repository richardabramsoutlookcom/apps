<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect 4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="title">
          <h1>Connect 4</h1>
          <p class="subtitle">1 Player vs Computer</p>
        </div>
        <div class="settings">
          <label class="select" for="difficulty">
            <span>Difficulty</span>
            <select id="difficulty">
              <option value="1">Rookie</option>
              <option value="2">Casual</option>
              <option value="3" selected>Skilled</option>
              <option value="4">Hard</option>
              <option value="5">Expert</option>
            </select>
          </label>
          <p class="status" id="status">Your turn · Red</p>
        </div>
      </header>

      <section class="board-wrap">
        <div class="column-buttons" id="column-buttons"></div>
        <div class="board" id="board" role="grid" aria-label="Connect 4 board"></div>
      </section>

      <footer class="controls">
        <button id="reset" class="reset">Reset game</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
